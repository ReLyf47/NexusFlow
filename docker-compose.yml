services:
  mariadb:
    image: mariadb:11.4-noble
    container_name: nexusflow_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-nexus_root_secret}
      MARIADB_DATABASE: ${DB_NAME:-nexusflow_db}
      MARIADB_USER: ${DB_USER:-nexus_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-nexus_pass_secret}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mariadb_nexusflow_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$$MARIADB_ROOT_PASSWORD --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mariadb_nexusflow_data:
    name: nexusflow_mariadb_data
